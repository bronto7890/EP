<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="styles.css" type="text/css"/>
<script src="resultTable.js" defer></script>
<title>Library</title>
</head>
<body>
 	<h1>Library</h1>
 	<div class="toolbar">
        <div class="search">
            <input type="search" id="searchInput" placeholder="Search title, author, genre, character...">
        </div>
        <div class="results" id="numResults"></div>
    </div>
	
	<div class="editButtons">
		<button class="addField" id="addField">+<span class="addText">Add a field - all fields required</span></button>
		<button class="editField" id="editField">Edit<span class="editText">Edit a field - only changing field</span></button>
		<button class="removeField" id="removeField">-<span class="removeText">Remove a field</span></button>
	</div>
	
	<br>
	
	<div class="editInputFields" id="editInputFields">
		<input type="text" id="idEntry" placeholder="Book ID...">
		<input type="text" id="titleEntry" placeholder="Title...">
		<input type="text" id="authorEntry" placeholder="Author...">
		<input type="text" id="dateEntry" placeholder="Date...">
		<input type="text" id="genreEntry" placeholder="Genres...">
		<input type="text" id="characterEntry" placeholder="Characters...">
		<input type="text" id="synopsisEntry" placeholder="Synopsis...">
		<button class="performCharnge" id="executeButton">Enter</button>
	</div>
	<div class="removeInputFields" id="removeInputFields">
	    <input type="text" id="removeIdEntry" placeholder="Book ID...">
	    <button id="removeExecuteButton">Enter</button>
	</div>
	
    <div class="table">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Date</th>
                    <th>Genres</th>
                    <th>Characters</th>
                    <th>Synopsis</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

	<div class="pageTab" id="pageTab" >
    	<button id="previousButton">Previous</button>
    	<span id="pageInfo"></span>
    	<button id="nextButton">Next</button>
	</div>
</body>
</html>
